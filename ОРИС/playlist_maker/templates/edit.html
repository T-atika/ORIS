{% extends "base.html" %}

{% block title %}Редактировать плейлист{% endblock %}

{% block content %}
    <h2>Редактировать плейлист</h2>

    {% if errors %}
        <div class="errors">
            <h3>Исправьте ошибки:</h3>
            <ul>
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('edit_playlist', playlist_id=playlist.id) }}">
        <p>
            <label>Название:</label><br>
            <input type="text" name="title" value="{{ title|default(playlist.title, true) }}">
        </p>
        <p>
            <label>Жанр:</label><br>
            <input type="text" name="genre" value="{{ genre|default(playlist.genre, true) }}">
        </p>
        <p>
            <label>Дата создания:</label><br>
            <input type="date" name="created_at" value="{{ created_at|default(playlist.created_at, true) }}">
        </p>
        <p>
            <label>Описание:</label><br>
            <textarea name="description" rows="4" cols="50">{{ description|default(playlist.description, true) }}</textarea>
        </p>
        <p>
            <button type="submit">Сохранить изменения</button>
        </p>
    </form>
{% endblock %}
