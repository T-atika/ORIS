<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Playlist Maker{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #FFF5F7;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #FF6B9D 0%, #FF3366 100%);
            padding: 20px 24px;
            box-shadow: 0 2px 8px rgba(255, 51, 102, 0.2);
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        nav a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        main {
            padding: 30px 50px;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #FF3366;
        }

        .card {
            background-color: #fff;
            padding: 20px 24px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 2px solid #FFE4E9;
            box-shadow: 0 2px 8px rgba(255, 51, 102, 0.08);
            transition: box-shadow 0.2s;
        }

        .card:hover {
            box-shadow: 0 4px 16px rgba(255, 51, 102, 0.15);
        }

        .card h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #FF3366;
        }

        .card p {
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }

        .card a {
            color: #FF3366;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .card a:hover {
            text-decoration: underline;
        }

        .btn {
            display: inline-block;
            padding: 0;
            background: none;
            border: none;
            color: #FF3366;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.2s;
        }

        .btn:hover {
            color: #E6295A;
            text-decoration: underline;
        }

        form button {
            padding: 0;
            background: none;
            color: #FF3366;
            border: none;
            border-radius: 0;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.2s;
        }

        form button:hover {
            color: #E6295A;
            text-decoration: underline;
        }

        .errors {
            background-color: #FFE4E9;
            border: 2px solid #FF3366;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }

        .errors h3 {
            color: #FF3366;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .errors ul {
            margin-left: 20px;
        }

        .errors li {
            color: #FF3366;
            font-size: 14px;
            margin-bottom: 4px;
        }

        form {
            background-color: #fff;
            padding: 28px;
            border-radius: 12px;
            border: 2px solid #FFE4E9;
            box-shadow: 0 2px 8px rgba(255, 51, 102, 0.08);
        }

        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #FF3366;
        }

        form input,
        form textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #FFE4E9;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        form input:focus,
        form textarea:focus {
            outline: none;
            border-color: #FF6B9D;
        }

        .detail-info p {
            font-size: 15px;
            margin-bottom: 10px;
        }

        .detail-info strong {
            color: #FF3366;
        }

        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .empty-state {
            text-align: center;
            padding: 60px 24px;
            color: #FF6B9D;
            font-size: 16px;
            background-color: #fff;
            border-radius: 12px;
            border: 2px dashed #FFE4E9;
        }
    </style>
</head>
<body>
    <header>
        <h1>Playlist Maker</h1>
            <nav>
                <a href="{{ url_for('index') }}">Все плейлисты</a>
                {% if session.get('user_id') %}
                    <a href="{{ url_for('add_playlist') }}">Добавить плейлист</a>
                    <a href="{{ url_for('logout') }}">Выйти</a>
                {% else %}
                    <a href="{{ url_for('login') }}">Войти</a>
                    <a href="{{ url_for('register') }}">Регистрация</a>
                {% endif %}
            </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
