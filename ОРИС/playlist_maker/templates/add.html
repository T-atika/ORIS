{% extends "base.html" %}

{% block title %}Добавить плейлист{% endblock %}

{% block content %}
    <h2>Создать новый плейлист</h2>

    {% if errors %}
        <div class="errors">
            <h3>Исправьте ошибки:</h3>
            <ul>
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('add_playlist') }}">
        <p>
            <label>Название:</label><br>
            <input type="text" name="title" value="{{ title|default('', true) }}">
        </p>
        <p>
            <label>Жанр:</label><br>
            <input type="text" name="genre" value="{{ genre|default('', true) }}">
        </p>
        <p>
            <label>Дата создания:</label><br>
            <input type="date" name="created_at" value="{{ created_at|default('', true) }}">
        </p>
        <p>
            <label>Описание:</label><br>
            <textarea name="description" rows="4" cols="50">{{ description|default('', true) }}</textarea>
        </p>
        <p>
            <button type="submit">Сохранить плейлист</button>
        </p>
    </form>
{% endblock %}
